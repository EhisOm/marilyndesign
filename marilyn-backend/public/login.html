<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Marilyn Designs</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,100&family=Raleway:wght@100&family=Source+Sans+Pro:wght@200&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    html, body { height: 100%; scroll-behavior: smooth; }
    body { background: #f9f9f9; color: #111; display: flex; flex-direction: column; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #111; color: #f9c74f; }
    #header-logo-h1 a { color: #f9c74f; text-decoration: none; font-family: 'Montserrat', sans-serif; }
    nav ul { list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0; }
    nav ul li a { color: #f9c74f; text-decoration: none; padding: 0.5rem 1rem; display: block; }
    nav ul li a:hover { background: #222; border-radius: 5px; }

    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; min-height: calc(100vh - 130px); }
    .login-container { background: #fff; padding: 2rem 1.5rem; border-radius: 10px; max-width: 360px; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,0.2); opacity: 0; transform: translateY(30px); animation: fadeSlideIn 0.6s forwards ease-out; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .login-container h2 { text-align: center; margin-bottom: 1.5rem; color: #111; }
    form { display: flex; flex-direction: column; gap: 1.8rem; position: relative; }
    .input-group { position: relative; display: flex; flex-direction: column; }
    input { padding: 0.75rem 0; border: none; border-bottom: 2px solid #ccc; font-size: 1rem; background: transparent; transition: border-color 0.3s; }
    input:focus { outline: none; border-bottom: 2px solid #f9c74f; }
    label { position: absolute; top: 0.75rem; left: 0; color: #aaa; font-size: 1rem; pointer-events: none; transition: 0.25s ease all; }
    input:focus + label, input:not(:placeholder-shown) + label { top: -0.75rem; font-size: 0.8rem; color: #f9c74f; }

    button { padding: 0.75rem; background: #111; color: #f9c74f; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: background 0.3s ease; }
    button:hover { background: #222; }

    .login-footer { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #555; }
    .login-footer a { color: #f9c74f; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }

    footer { text-align: center; padding: 1rem; background: #111; color: #f9c74f; }
    footer a { color: #f9c74f; text-decoration: none; }

    @media (max-width: 480px) {
      header { flex-direction: column; align-items: flex-start; padding: 1rem; }
      nav ul { flex-direction: column; width: 100%; }
      main { padding: 1rem; min-height: auto; }
      .login-container { padding: 1.5rem 1rem; max-width: 90%; }
      button { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-logo-h1">
      <a href="index.html">MARILYN<small>DESIGNS</small></a>
    </h1>
    <nav>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html">Shop</a></li>
        <li><a href="about.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="login-container">
      <h2>Login</h2>
      <form id="form-log">
        <div class="input-group">
          <input type="text" name="username" placeholder=" " required>
          <label>Username or Email</label>
        </div>
        <div class="input-group">
          <input type="password" name="password" placeholder=" " required>
          <label>Password</label>
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="login-footer">
        <p>Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>LONDON, UK.</p>
    <p><a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
  </footer>

  <script>
    // Update nav links dynamically based on login status
    function showAccountLinks() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user'));
      const nav = document.getElementById('nav-links');
      if (token && user) {
        const firstName = user.firstName || user.username || 'Account';
        nav.innerHTML = `
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html">Shop</a></li>
          <li><a href="about.html">Contact</a></li>
          <li><a href="profile.html">Hi, ${firstName}</a></li>
          <li><a href="#" id="logout">Logout</a></li>
        `;
        document.getElementById('logout').addEventListener('click', () => {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          location.reload();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', showAccountLinks);

    // Login form submission
    document.getElementById('form-log').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameOrEmail = e.target.username.value.trim();
      const password = e.target.password.value.trim();
      if (!usernameOrEmail || !password) { alert('Please enter username and password'); return; }
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernameOrEmail, password }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.message || 'Login failed'); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showAccountLinks(); // immediately update nav after login
        window.location.href = '/welcome.html';
      } catch (err) {
        console.error('Login error:', err);
        alert('Server error, please try again later.');
      }
    });
  </script>

</body>
</html>
