<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WOMEN</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Raleway:wght@300;700&family=Source+Sans+Pro:wght@300;600&display=swap" rel="stylesheet" />

<style>
  /* ========== BASE ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Raleway', sans-serif;
    background: #fdfdfd;
    color: #333;
    display: flex;
    flex-direction: column;
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  /* ========== HEADER (Desktop defaults unchanged) ========== */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    color: #fff;
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #header-logo-men a {
    font-family: 'Montserrat', sans-serif;
    font-size: 2rem;
    color: #fff;
    letter-spacing: 2px;
  }
  #header-logo-men small { font-weight: 300; font-size: 0.8rem; color: #f9c74f; }

  /* nav container */
  #header-menu { position: relative; }
  /* desktop menu */
  #header-menu .menu {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }
  #header-menu .menu > li > a {
    color: #f9c74f;
    font-weight: 600;
    transition: 0.3s;
    padding: 0.25rem 0;
  }
  #header-menu .menu > li > a:hover,
  #header-menu .menu > li > a[aria-current="page"] {
    color: #fff;
    border-bottom: 2px solid #f9c74f;
  }

  /* dropdown (desktop hover) */
  .dropdown { position: relative; }
  .dropdown-content {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + 8px);
    background-color: #111;
    min-width: 220px; /* roomy for long labels */
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    overflow: hidden;
    z-index: 100;
  }
  .dropdown-content a {
    display: block;
    padding: 0.6rem 1rem;
    color: #f9c74f;
    font-weight: 500;
    transition: 0.3s;
    white-space: nowrap;
  }
  .dropdown-content a:hover { background: #222; color: #fff; }
  /* show on hover (desktop) */
  .dropdown:hover .dropdown-content { display: block; }

  /* cart icon */
  #cart-icon { position: relative; font-size: 1.2rem; cursor: pointer; }
  #cart-count {
    position: absolute; top: -10px; right: -10px;
    background: #f9c74f; color: #111;
    font-size: 0.8rem; font-weight: bold;
    padding: 2px 6px; border-radius: 50%;
  }

  /* ========== MAIN GRID (Desktop defaults) ========== */
  main { flex: 1; }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2rem;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .product-card {
    position: relative;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.2); }
  .product-card img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    transition: transform 0.5s;
  }
  .product-card:hover img { transform: scale(1.1); }

  /* hover overlay (desktop) */
  .product-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7); color: #fff;
    padding: 1rem; opacity: 0; transition: opacity 0.3s;
    border-radius: 0 0 12px 12px;
  }
  .product-card:hover .product-info { opacity: 1; }
  .product-info a {
    color: #f9c74f; font-weight: 600; display: block; margin-bottom: 0.5rem;
  }
  button {
    padding: 0.5rem 1.2rem; border: none; background: #f9c74f; color: #111;
    font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.4s;
  }
  button:hover { background: #e0b034; }

  /* footer */
  footer {
    text-align: center; background: #111; color: #fff;
    padding: 2rem 1rem; font-size: 0.9rem; margin-top: auto;
  }

  /* ========== HAMBURGER (hidden on desktop) ========== */
  .hamburger {
    display: none;
    width: 44px; height: 38px;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    background: transparent;
    align-items: center; justify-content: center;
    gap: 6px; flex-direction: column;
    cursor: pointer;
    margin-left: 1rem;
  }
  .hamburger span {
    display: block; width: 26px; height: 3px; background: #f9c74f; border-radius: 2px; transition: 0.3s;
  }
  .hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

  /* ========== TABLET ========== */
  @media (max-width: 992px) {
    header { flex-wrap: wrap; row-gap: 0.75rem; }
    /* show hamburger, keep desktop look otherwise */
    .hamburger { display: inline-flex; }
    /* collapse menu by default */
    #header-menu .menu {
      display: none; /* overridden when opened */
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #111;
      flex-direction: column;
      padding: 0.5rem 0;
      gap: 0;
      border-top: 1px solid #222;
      max-height: 80vh;
      overflow-y: auto;
    }
    #header-menu.open .menu { display: flex; }

    #header-menu .menu > li { width: 100%; }
    #header-menu .menu > li > a {
      display: block; width: 100%;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #1e1e1e;
    }

    /* dropdown becomes tap-to-open, full width */
    .dropdown .dropdown-content {
      position: static;
      display: none;
      min-width: 100%;
      border-radius: 0;
      box-shadow: none;
      border-top: 1px solid #1e1e1e;
    }
    .dropdown.open .dropdown-content { display: block; }
    .dropdown-content a {
      white-space: normal;
      padding: 0.85rem 1.25rem;
    }
  }

  /* ========== MOBILE ========== */
  @media (max-width: 768px) {
    header { flex-direction: column; align-items: stretch; padding: 1rem; }
    #header-logo-men a { font-size: 1.7rem; text-align: center; }

    /* product grid tighter */
    .products-grid {
      padding: 1rem;
      gap: 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    /* show product info below image, no hover needed */
    .product-info {
      position: static;
      opacity: 1;
      background: #111;
      color: #f9c74f;
      border-radius: 0 0 12px 12px;
      margin-top: 0.35rem;
      padding: 0.6rem 0.75rem;
    }
    .product-card:hover img { transform: none; }
    .product-card:hover { transform: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  }

  /* ========== SMALL MOBILE ========== */
  @media (max-width: 480px) {
    .products-grid { grid-template-columns: 1fr; }
    #header-logo-men a { font-size: 1.5rem; }
  }
</style>
</head>

<body>
<header>
  <h1 id="header-logo-men">
    <a href="index.html">MARILYN <small>DESIGNS</small></a>
  </h1>

  <nav id="header-menu" aria-label="Primary">
    <button class="hamburger" id="navToggle" aria-expanded="false" aria-controls="mainMenu" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <ul id="mainMenu" class="menu">
      <li><a href="index.html">HOME</a></li>

      <li class="dropdown">
        <a href="#" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">SHOP ▾</a>
        <div class="dropdown-content" role="menu">
          <a href="men.html">Men</a>
          <a href="women.html" aria-current="page">Women</a>
          <a href="kids.html">Kids</a>
        </div>
      </li>

      <li><a href="about.html">ABOUT US</a></li>
      <li><a href="cart.html" id="cart-icon">🛒 <span id="cart-count">0</span></a></li>

      <li class="dropdown" id="accountDropdown" style="display:none;">
        <a href="#" id="userNameDisplay" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">My Account ▾</a>
        <div class="dropdown-content" role="menu">
          <a href="profile.html">Profile</a>
          <a href="cart.html">Orders</a>
          <a href="#" id="signOutLink">Sign Out</a>
        </div>
      </li>

      <li id="loginLinks">
        <a href="login.html">Login</a> | <a href="register.html">Register</a>
      </li>
    </ul>
  </nav>
</header>

<main class="products-grid">
  <figure class="product-card">
    <a href="#"><img src="images/Knatchbullcloth.png" alt="Senator Material" /></a>
    <figcaption class="product-info">
      <a href="#">Senator Mat</a>
      <a href="#">₦21,911.99</a>
      <button onclick="addToCart({name:'Senator Mat', price:21911.99, image:'images/Knatchbullcloth.png'})">Add to Cart</button>
    </figcaption>
  </figure>

  <figure class="product-card">
    <a href="#"><img src="images/vluclot3.png" alt="Women's armless" /></a>
    <figcaption class="product-info">
      <a href="#">Women's armless</a>
      <a href="#">₦21,121.99</a>
      <button onclick="addToCart({name:'Womens armless', price:21121.99, image:'images/mat1.jpg'})">Add to Cart</button>
    </figcaption>
  </figure>

  <figure class="product-card">
    <a href="#"><img src="images/redClo.png" alt="Women's Materials" /></a>
    <figcaption class="product-info">
      <a href="#">Red Materials</a>
      <a href="#">₦31,021.99</a>
      <button onclick="addToCart({name:'Red Materials', price:31021.99, image:'images/redClo.png'})">Add to Cart</button>
    </figcaption>
  </figure>

  <figure class="product-card">
    <a href="#"><img src="images/trousernvest.png" alt="Trouser & Vest" /></a>
    <figcaption class="product-info">
      <a href="#">Trouser & Vest</a>
      <a href="#">₦41,121.99</a>
      <button onclick="addToCart({name:'Trouser & Vest', price:41121.99, image:'images/trousernvest.png'})">Add to Cart</button>
    </figcaption>
  </figure>
</main>

<footer>
  <p>LONDON, UK. &nbsp;<a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
</footer>

<script>
  /* ===== Cart helpers ===== */
  function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    document.getElementById('cart-count').textContent = cart.length;
  }
  function addToCart(item) {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.push({
      name: item.name,
      price: item.price,
      image: item.image || 'images/placeholder.png'
    });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(item.name + " has been added to your cart!");
  }

  /* ===== Auth display ===== */
  function checkAuth() {
    let userStr = localStorage.getItem('user');
    const accountDropdown = document.getElementById('accountDropdown');
    const loginLinks = document.getElementById('loginLinks');
    const userNameDisplay = document.getElementById('userNameDisplay');

    if (userStr) {
      const user = JSON.parse(userStr);
      accountDropdown.style.display = 'block';
      loginLinks.style.display = 'none';
      userNameDisplay.textContent = (user.title ? user.title + ' ' : '') + (user.name || 'My Account') + ' ▾';
    } else {
      accountDropdown.style.display = 'none';
      loginLinks.style.display = 'block';
    }
  }
  function signOut() {
    localStorage.removeItem('user');
    alert("Signed out successfully!");
    checkAuth();
  }

  /* ===== Mobile nav + dropdown toggles ===== */
  const nav = document.getElementById('header-menu');
  const toggleBtn = document.getElementById('navToggle');
  const mainMenu = document.getElementById('mainMenu');

  function closeAllMobileDropdowns() {
    document.querySelectorAll('#mainMenu .dropdown.open').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('#mainMenu .dropdown .dropdown-toggle[aria-expanded="true"]').forEach(a => a.setAttribute('aria-expanded', 'false'));
  }

  toggleBtn.addEventListener('click', () => {
    const isOpen = nav.classList.toggle('open');
    toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (!isOpen) closeAllMobileDropdowns();
  });

  // Tap-to-open dropdowns on mobile/tablet
  mainMenu.addEventListener('click', (e) => {
    const w = window.innerWidth;
    const t = e.target;
    if (w <= 992 && t.classList.contains('dropdown-toggle')) {
      e.preventDefault();
      const li = t.closest('.dropdown');
      const isOpen = li.classList.toggle('open');
      t.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
  });

  // Reset state on resize back to desktop
  window.addEventListener('resize', () => {
    if (window.innerWidth > 992) {
      nav.classList.remove('open');
      toggleBtn.setAttribute('aria-expanded', 'false');
      closeAllMobileDropdowns();
    }
  });

  // Account sign out link
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'signOutLink') {
      e.preventDefault();
      signOut();
    }
  });

  // Init
  updateCartCount();
  checkAuth();
</script>
</body>
</html>
