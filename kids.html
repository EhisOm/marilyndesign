    "name":"Kids Clothes",
    "price":21911.99,
    "images":{"Blue":["images/kidscloth.png"],"Green":["images/kidsskirt.png"]},
    "sizes":["S","M","L"]
  }'>

      <img class="main-img" src="images/kidscloth.png" alt="Kids Clothes">
