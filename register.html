<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MARILYN DESIGNS - Register</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Raleway:wght@300;700&family=Source+Sans+Pro:wght@300;600&display=swap" rel="stylesheet" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Raleway', sans-serif; background: #fdfdfd; color: #333; display: flex; flex-direction: column; }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  /* HEADER */
  header { display: flex; justify-content: space-between; align-items: center; background: #111; color: #fff; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
  #head-logo a { font-family: 'Montserrat', sans-serif; font-size: 2rem; color: #fff; letter-spacing: 2px; }
  #head-logo small { font-weight: 300; font-size: 0.8rem; color: #f9c74f; }
  nav ul { display: flex; gap: 1.5rem; align-items: center; }
  nav ul li a { color: #f9c74f; font-weight: 600; transition: 0.3s; }
  nav ul li a:hover, nav ul li a[aria-current="page"] { color: #fff; border-bottom: 2px solid #f9c74f; }

  /* MAIN FORM */
  main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
  .form-p { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
  .form-p input, .form-p select, .form-p button { width: 100%; padding: 0.8rem 1rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
  .form-p select { background: #fff; }
  .form-p button { background: #f9c74f; color: #111; border: none; font-weight: bold; cursor: pointer; transition: all 0.4s; margin-top: 1rem; }
  .form-p button:hover { background: #e0b034; }

  /* ADDRESS SECTION */
  .address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1rem;
    margin-bottom: 1rem;
  }
  .address-grid input { margin-bottom: 0; }
  .full-width { grid-column: span 2; }

  /* FOOTER */
  footer { text-align: center; background: #111; color: #fff; padding: 2rem 1rem; font-size: 0.9rem; margin-top: auto; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header { flex-direction: column; gap: 1rem; }
    nav ul { flex-direction: column; gap: 0.8rem; }
    .form-p { padding: 1.5rem; }
    .address-grid { grid-template-columns: 1fr; }
    .full-width { grid-column: span 1; }
  }
  @media (max-width: 480px) {
    header { padding: 1rem; }
  }
</style>
</head>

<body>
<header>
  <h1 id="head-logo"><a href="index.html">MARILYN <small>DESIGNS</small></a></h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main>
  <form class="form-p" id="registerForm">
    <select name="title" id="title">
      <option value="" selected disabled>Title</option>
      <option value="Mr">Mr.</option>
      <option value="Ms">Ms.</option>
      <option value="Mrs">Mrs.</option>
      <option value="Dr">Dr.</option>
    </select>

    <input type="text" name="name" id="name" placeholder="Enter Your Full Names" />
    <input type="text" name="username" id="username" placeholder="Enter Your Username" required pattern="[a-zA-Z0-9]+" title="Letters and numbers only" />
    <input type="email" name="email" id="email" placeholder="Enter Your Email Address" required />
    <input type="password" name="password" id="password" placeholder="Enter Your Password" required minlength="6" />
    <input type="tel" name="phone" id="phone" placeholder="Enter Your Phone Number" />
    <input type="date" id="dob" name="dob" min="1911-01-01" max="2025-12-31" />

    <!-- Address Fields -->
    <div class="address-grid">
      <input type="text" name="street" id="street" placeholder="Street Address" class="full-width" />
      <input type="text" name="city" id="city" placeholder="City" />
      <input type="text" name="state" id="state" placeholder="State / Province" />
      <input type="text" name="zip" id="zip" placeholder="Zip / Postal Code" />
      <input type="text" name="country" id="country" placeholder="Country" class="full-width" />
    </div>

    <button type="submit">Register</button>
  </form>
</main>

<footer>
  <p>LONDON, UK. &nbsp;<a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
</footer>

<!-- JS to handle registration -->
<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = {
      title: document.getElementById("title").value,
      name: document.getElementById("name").value,
      username: document.getElementById("username").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      phone: document.getElementById("phone").value,
      dob: document.getElementById("dob").value,
      street: document.getElementById("street").value,
      city: document.getElementById("city").value,
      state: document.getElementById("state").value,
      zip: document.getElementById("zip").value,
      country: document.getElementById("country").value
    };

    try {
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      });

      const data = await res.json();

      if (res.ok) {
        alert("✅ Registration successful! Please login.");
        window.location.href = "login.html";
      } else {
        alert("❌ " + (data.message || "Registration failed"));
      }
    } catch (err) {
      console.error("Error:", err);
      alert("⚠️ Something went wrong. Try again.");
    }
});
</script>

</body>
</html>
