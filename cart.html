<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - MARILYN CLOTHINGS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;700&display=swap" rel="stylesheet">
<!-- <link rel="stylesheet" href="style.css"> -->
<style>
  /* Keeping your original cart styles */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Montserrat', sans-serif; background:#f5f5f5; color:#111; display:flex; flex-direction:column; min-height:100vh; }

  header { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:#111; color:#f9c74f; position:relative; }
  header h1 a { color:#f9c74f; text-decoration:none; font-weight:700; }
  header h1 small { font-weight:100; font-size:0.6em; }

  nav ul { list-style:none; display:flex; gap:1rem; align-items:center; transition:max-height 0.4s ease; }
  nav ul li { position:relative; }
  nav ul li a { color:#f9c74f; text-decoration:none; padding:0.5rem 1rem; display:block; transition:0.3s; }
  nav ul li a:hover { background:#4d0303; border-radius:5px; }

  .cart-badge { position:absolute; top:-5px; right:-10px; background:red; color:white; font-size:0.7rem; padding:2px 6px; border-radius:50%; font-weight:bold; }

  .dropdown-content { display:none; position:absolute; top:100%; left:0; background:#111; min-width:150px; border-radius:5px; box-shadow:0 5px 15px rgba(0,0,0,0.3); overflow:hidden; z-index:99; }
  .dropdown-content a { display:block; padding:0.5rem 1rem; color:#f9c74f; }
  .dropdown.active .dropdown-content { display:block; }

  #loginLinks a { margin-right:0.5rem; display:inline-block; }

  main { flex:1; padding:2rem; max-width:1200px; margin:0 auto; }
  h2 { text-align:center; margin-bottom:1.5rem; }

  .table-container { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }

  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 8px rgba(0,0,0,0.1); min-width:600px; }
  th, td { padding:1rem; text-align:center; border-bottom:1px solid #eee; vertical-align:middle; }
  th { background:#f9c74f; color:#111; }
  td img { width:80px; height:80px; object-fit:cover; border-radius:5px; cursor:pointer; display:block; margin:0 auto; }

  #cartTable td:nth-child(2), #cartTable th:nth-child(2) { word-break:break-word; text-align:left; }
  #cartTable td:nth-child(3), #cartTable th:nth-child(3),
  #cartTable td:nth-child(5), #cartTable th:nth-child(5) { white-space:nowrap; }

  .remove-btn { cursor:pointer; color:red; font-size:1.2rem; }
  .continue-btn, .payment-btn, .clear-btn { padding:0.8rem 1.5rem; margin-right:1rem; border:none; border-radius:5px; cursor:pointer; font-weight:bold; transition:0.3s; }
  .continue-btn, .payment-btn, .clear-btn { background:#f9c74f; color:#111; }
  .continue-btn:hover, .payment-btn:hover, .clear-btn:hover { background:#d4a000; color:#fff; }

  .totals { text-align:right; margin-top:1rem; font-weight:bold; font-size:1.1rem; }
  footer { text-align:center; padding:1rem; background:#111; color:#f9c74f; margin-top:auto; }
  input[type=number] { width:50px; text-align:center; border-radius:5px; padding:0.2rem; border:1px solid #ccc; }

  .hamburger { display:none; flex-direction:column; cursor:pointer; }
  .hamburger div { width:25px; height:3px; background:#f9c74f; margin:4px 0; transition:0.4s; }

  #cartLightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:999; }
  #cartLightbox img { max-width:90%; max-height:90%; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.5); }

  @media (max-width: 768px) {
    nav ul { flex-direction:column; position:absolute; top:60px; right:0; background:#111; width:220px; display:none; border-radius:5px; padding:1rem; max-height:0; overflow:hidden; }
    nav ul li { width:100%; }
    .hamburger { display:flex; }
    .dropdown-content { right:0; left:auto; min-width:160px; }
    main { padding:0.5rem; }
    table, thead, tbody, th, td, tr { display:block; width:100%; }
    thead { display:none; }
    tbody { display:block; }
    tr { display:flex; flex-wrap:wrap; align-items:center; border-bottom:1px solid #eee; padding:0.4rem 0; }
    td { flex:1 1 100%; display:flex; justify-content:space-between; padding:0.3rem; font-size:0.8rem; }
    td:nth-child(1) { flex:0 0 40px; margin-right:0.3rem; }
    td:nth-child(1) img { width:32px; height:32px; }
    td:nth-child(2) { flex:1 1 auto; text-align:left; font-size:0.85rem; }
    td:nth-child(3), td:nth-child(4), td:nth-child(5), td:nth-child(6) { flex:0 0 auto; font-size:0.75rem; white-space:nowrap; }
    input[type=number] { width:35px; font-size:0.75rem; padding:0.15rem; }
    .continue-btn, .payment-btn, .clear-btn { display:block; width:100%; margin:0.3rem 0; padding:0.45rem; font-size:0.8rem; }
    .totals { text-align:center; font-size:0.85rem; margin-top:0.6rem; }
  }

  nav ul.active { display:flex; max-height:1000px; transition:max-height 0.4s ease; }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">MARILYN <small>DESIGNS</small></a></h1>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li class="dropdown">
        <a href="#">SHOP ▾</a>
        <div class="dropdown-content">
          <a href="men.html">Men</a>
          <a href="women.html">Women</a>
          <a href="kids.html">Kids</a>
        </div>
      </li>
      <li><a href="about.html">ABOUT US</a></li>
      <li><a href="cart.html">🛒 Cart <span class="cart-badge" id="cartCount">0</span></a></li>
      <li id="loginLinks"><a href="login.html">Login</a> | <a href="register.html">Register</a></li>
      <li class="dropdown" id="accountDropdown" style="display:none;">
        <a href="#" id="userNameDisplay">My Account ▾</a>
        <div class="dropdown-content">
          <a href="profile.html">Profile</a>
          <a href="#" onclick="signOut()">Sign Out</a>
        </div>
      </li>
    </ul>
  </nav>
</header>

<main>
  <h2>Your Cart</h2>
  <div class="table-container">
    <table id="cartTable">
      <thead>
        <tr>
          <th>Product</th><th>Name</th><th>Price</th><th>Quantity</th><th>Total</th><th>Remove</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="totals">Grand Total: ₦<span id="grandTotal">0.00</span></div>
  <button class="continue-btn" onclick="window.location.href='index.html'">Continue Shopping</button>
  <button class="payment-btn" onclick="proceedToPayment()">Proceed to Payment</button>
  <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
</main>

<div id="cartLightbox" onclick="this.style.display='none'">
  <img id="cartLightboxImg" src="" alt="Product Image">
</div>

<footer>
  <p>LONDON, UK. &nbsp;<a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
</footer>

<script src="cart.js"></script>
<script src="script.js"></script>
</body>
</html>
