<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile - MARILYN DESIGNS</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Raleway:wght@300;700&family=Source+Sans+Pro:wght@300;600&display=swap" rel="stylesheet" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Raleway', sans-serif; background: #fdfdfd; color: #333; display: flex; flex-direction: column; }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  header { display: flex; justify-content: space-between; align-items: center; background: #111; color: #fff; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
  #header-logo-men a { font-family: 'Montserrat', sans-serif; font-size: 2rem; color: #fff; letter-spacing: 2px; }
  #header-logo-men small { font-weight: 300; font-size: 0.8rem; color: #f9c74f; }
  #header-menu ul { display: flex; gap: 1.5rem; align-items: center; }
  #header-menu ul li a { color: #f9c74f; font-weight: 600; transition: 0.3s; }
  #header-menu ul li a:hover, #header-menu ul li a[aria-current="page"] { color: #fff; border-bottom: 2px solid #f9c74f; }

  .dropdown { position: relative; }
  .dropdown-content { display: none; position: absolute; left: 0; background-color: #111; min-width: 150px; border-radius: 8px; box-shadow: 0 5px 10px rgba(0,0,0,0.3); overflow: hidden; z-index: 100; }
  .dropdown-content a { display: block; padding: 0.5rem 1rem; color: #f9c74f; font-weight: 500; transition: 0.3s; }
  .dropdown-content a:hover { background: #222; color: #fff; }
  .dropdown:hover .dropdown-content { display: block; }

  footer { text-align: center; background: #111; color: #fff; padding: 2rem 1rem; font-size: 0.9rem; margin-top: auto; }

  main { flex: 1; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  .profile-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .profile-card h2 { margin-bottom: 1rem; }
  .profile-card p { margin-bottom: 0.5rem; font-weight: 500; }
  button { padding: 0.5rem 1.2rem; border: none; background: #f9c74f; color: #111; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.4s; }
  button:hover { background: #e0b034; }

  @media (max-width: 768px) {
    header { flex-direction: column; gap: 1rem; }
    #header-menu ul { flex-direction: column; gap: 0.8rem; }
  }
</style>
</head>

<body>
<header>
  <h1 id="header-logo-men"><a href="index.html">MARILYN <small>DESIGNS</small></a></h1>
  <nav id="header-menu">
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li class="dropdown">
        <a href="#">SHOP ▾</a>
        <div class="dropdown-content">
          <a href="men.html">Men</a>
          <a href="women.html">Women</a>
          <a href="kids.html">Kids</a>
        </div>
      </li>
      <li><a href="about.html">ABOUT US</a></li>
      <li class="dropdown" id="accountDropdown">
        <a href="#" id="userNameDisplay">My Account ▾</a>
        <div class="dropdown-content">
          <a href="profile.html">Profile</a>
          <a href="cart.html">Orders</a>
          <a href="#" onclick="signOut()">Sign Out</a>
        </div>
      </li>
    </ul>
  </nav>
</header>

<main>
  <div class="profile-card">
    <h2>Profile Information</h2>
    <p><strong>Title:</strong> <span id="profileTitle"></span></p>
    <p><strong>Name:</strong> <span id="profileName"></span></p>
    <p><strong>Email:</strong> <span id="profileEmail"></span></p>
    <p><strong>Phone:</strong> <span id="profilePhone"></span></p>
    <p><strong>Date of Birth:</strong> <span id="profileDOB"></span></p>
    <p><strong>Age:</strong> <span id="profileAge"></span></p>
    <p><strong>Address:</strong> <span id="profileAddress"></span></p>
    <button onclick="signOut()">Sign Out</button>
  </div>
</main>

<footer>
  <p>LONDON, UK. &nbsp;<a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
</footer>

<script>
function calculateAge(dob) {
  const birthDate = new Date(dob);
  const today = new Date();
  let age = today.getFullYear() - birthDate.getFullYear();
  const m = today.getMonth() - birthDate.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
  return age;
}

function checkAuth() {
  const userStr = localStorage.getItem('user');
  const accountDropdown = document.getElementById('accountDropdown');
  const userNameDisplay = document.getElementById('userNameDisplay');
  if (!userStr) {
    alert("You must be signed in to view this page.");
    window.location.href = 'login.html';
    return;
  }

  const user = JSON.parse(userStr);
  accountDropdown.style.display = 'block';
  userNameDisplay.textContent = `${user.title} ${user.name} ▾`;

  document.getElementById('profileTitle').textContent = user.title || 'N/A';
  document.getElementById('profileName').textContent = user.name || 'N/A';
  document.getElementById('profileEmail').textContent = user.email || 'N/A';
  document.getElementById('profilePhone').textContent = user.phone || 'N/A';
  document.getElementById('profileDOB').textContent = user.dob || 'N/A';
  document.getElementById('profileAge').textContent = user.dob ? calculateAge(user.dob) : 'N/A';
  
  const address = `${user.street || ''}, ${user.city || ''}, ${user.state || ''}, ${user.zip || ''}, ${user.country || ''}`;
  document.getElementById('profileAddress').textContent = address.replace(/(, )+/g, ', ').replace(/^, |, $/g, '');
}

function signOut() {
  localStorage.removeItem('user');
  alert("Signed out successfully!");
  window.location.href = 'index.html';
}

checkAuth();
</script>
</body>
</html>
