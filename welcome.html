<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome - MARILYNDESIGNS</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,100&family=Raleway:wght@100&family=Source+Sans+Pro:wght@200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    html, body { height: 100%; scroll-behavior: smooth; background: #f9f9f9; color: #111; display: flex; flex-direction: column; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #111; color: #f9c74f; box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1000; }
    header a { text-decoration: none; color: #f9c74f; }
    .head-img { max-height: 70px; width: auto; }
    nav ul { list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0; }
    nav ul li a { color: #f9c74f; text-decoration: none; padding: 0.5rem 1rem; display: block; transition: background 0.3s; }
    nav ul li a:hover { background: #222; border-radius: 5px; }

    /* Main Welcome Section */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; }
    .welcome-container { background: #fff; padding: 2rem 2rem; border-radius: 10px; max-width: 400px; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,0.2); text-align: center; opacity: 0; transform: translateY(30px); animation: fadeSlideIn 0.6s forwards ease-out; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .welcome-text { font-size: 1.5rem; font-weight: bold; color: #111; margin-bottom: 2rem; }
    button { background: #111; color: #f9c74f; border: none; border-radius: 8px; padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s ease, transform 0.2s ease; }
    button:hover { background: #222; transform: scale(1.05); }

    /* Footer Fixed */
    footer { background: #111; color: #f9c74f; padding: 1.5rem 1rem; text-align: center; font-size: 0.9rem; position: fixed; bottom: 0; left: 0; width: 100%; box-shadow: 0 -2px 8px rgba(0,0,0,0.2); }
    footer a { color: #f9c74f; text-decoration: none; font-weight: bold; }
    footer a small { font-weight: normal; }
    footer a:hover { color: #ffcc66; }

    /* Responsive */
    @media (max-width: 480px) {
      header { flex-direction: column; align-items: flex-start; }
      nav ul { flex-direction: column; width: 100%; }
      .welcome-container { padding: 1.5rem; max-width: 90%; }
      button { width: 80%; padding: 10px 0; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">
      <img class="head-img" src="images/marilynDesign.jpg" alt="Marilyn Designs Logo" />
    </a>
    <nav>
      <ul id="nav-links">
        <!-- Navigation links injected by auth.js -->
      </ul>
    </nav>
  </header>

  <main>
    <div class="welcome-container">
      <div class="welcome-text" id="welcomeText">Welcome</div>
      <button onclick="location.href='index.html'">Start Shopping</button>
    </div>
  </main>

  <footer>
    <p>LONDON, UK.</p>
    <p><a href="#">OMIJIE.E <small>DESIGN</small></a> &copy; 2022 COPYRIGHT</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
